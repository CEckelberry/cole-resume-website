services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: portfolio-web:dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        BUILD_SHA: dev
        VERSION: dev
    image: portfolio-api:dev
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      DATABASE_URL: postgres://portfolio:portfolio@db:5432/portfolio?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - portfolio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfolio-db:
