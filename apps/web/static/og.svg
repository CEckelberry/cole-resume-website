<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="cole eckelberry — platform engineer">
  <!-- Background canvas -->
  <rect width="1200" height="630" fill="#0e0820"/>

  <!-- Mesh blobs, blurred to feel like the live site -->
  <defs>
    <filter id="b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED93B1"/>
      <stop offset="50%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#5DCAA5"/>
    </linearGradient>
  </defs>

  <g filter="url(#b)" opacity="0.55">
    <circle cx="180" cy="120" r="220" fill="#ED93B1"/>
    <circle cx="1080" cy="160" r="240" fill="#5DCAA5"/>
    <circle cx="240" cy="540" r="260" fill="#7F77DD"/>
    <circle cx="1020" cy="540" r="220" fill="#FAC775"/>
  </g>

  <!-- Subtle polygon decorations -->
  <g opacity="0.18">
    <polygon points="100,80 130,140 70,140" fill="#F4C0D1" transform="rotate(28 100 110)"/>
    <polygon points="1080,90 1110,150 1050,150" fill="#9FE1CB" transform="rotate(-12 1080 120)"/>
    <polygon points="120,500 160,540 80,540" fill="#CECBF6"/>
    <polygon points="1100,520 1140,560 1060,560" fill="#FAEEDA" transform="rotate(40 1100 540)"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="220"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="22" font-weight="500"
    letter-spacing="6"
    fill="rgba(255,255,255,0.62)">PORTFOLIO · 2026</text>

  <!-- Name (gradient on Eckelberry) -->
  <text x="80" y="360"
    font-family="Inter, system-ui, sans-serif"
    font-size="116" font-weight="500"
    letter-spacing="-3"
    fill="#ffffff">Cole</text>

  <text x="280" y="360"
    font-family="Inter, system-ui, sans-serif"
    font-size="116" font-weight="500"
    letter-spacing="-3"
    fill="url(#grad)">Eckelberry</text>

  <!-- Tagline (italic serif) -->
  <text x="80" y="440"
    font-family="Instrument Serif, Georgia, serif"
    font-style="italic"
    font-size="42"
    fill="rgba(255,255,255,0.78)">platform engineer · making weird things after 5pm.</text>

  <!-- URL micro-line -->
  <text x="80" y="560"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="20"
    letter-spacing="3"
    fill="rgba(255,255,255,0.45)">cole-eckelberry.com</text>

  <!-- Live dot in corner -->
  <circle cx="1135" cy="68" r="6" fill="#5DCAA5"/>
  <text x="1110" y="73"
    font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="14"
    text-anchor="end"
    letter-spacing="2"
    fill="rgba(255,255,255,0.62)">LIVE</text>
</svg>
